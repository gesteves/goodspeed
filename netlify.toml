# Netlify build config for the Goodspeed web dashboard.
#
# The dashboard lives in the web/ subdirectory of this monorepo. Netlify's
# standard Git-triggered build flow deploys it: on every push to the linked
# branch, Netlify runs `npm run check && npm run build` -- `check` is
# `lint && typecheck && test`, so a failing check stops the deploy.
#
# The dashboard is built with Astro + `@astrojs/netlify`. The adapter writes
# the function bundle and a `_redirects` file under `web/.netlify/`, which
# Netlify picks up automatically -- no build plugin needed.
#
# Node version comes from web/.nvmrc (lts/*).

[build]
  base = "web"
  command = "npm run check && npm run build"

# Plausible analytics proxy. Per https://plausible.io/docs/proxy/guides/netlify
# -- the script and event endpoint are served from this domain so the analytics
# requests aren't blocked by ad blockers / privacy extensions, while the data
# still goes to plausible.io. Both rewrites use status 200 (proxy, not a 301).
# `force = true` on /api/event wins over the Astro adapter's catch-all
# function route so events still post through to plausible.io.
[[redirects]]
  from = "/js/pa-Ql_GCQ3RubH8FjaceAlmn.js"
  to = "https://plausible.io/js/pa-Ql_GCQ3RubH8FjaceAlmn.js"
  status = 200

[[redirects]]
  from = "/api/event"
  to = "https://plausible.io/api/event"
  status = 200
  force = true

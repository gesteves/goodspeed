[project]
name = "goodspeed"
version = "0.1.0"
description = "Goodspeed — SFBOFS SFB1204 station data fetcher + publisher for the Alcatraz crossing"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
    # xarray uses CalVer (YYYY.MM). Allow any 2024.10–2025.x; bump deliberately
    # when 2026.x lands so a calendar-year transition doesn't slip in via a
    # `uv lock --upgrade`.
    "xarray>=2024.10,<2027",
    "netCDF4>=1.7.1,<1.8",
    "numpy>=2.1,<2.5",
    "jsonschema>=4.23,<5",
    "apscheduler>=3.10,<4",
    "requests>=2.32,<3",
    "starlette>=0.40,<1.2",
    "uvicorn[standard]>=0.32,<0.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-mock>=3.14,<4",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
goodspeed = "goodspeed.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodspeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

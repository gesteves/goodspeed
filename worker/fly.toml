# Fly app config for the Goodspeed worker (SFBOFS / SFB1204 fetcher).
#
# Deploy from the repo root so the Docker build context includes both
# worker/ and schema/:
#
#   fly deploy --config worker/fly.toml --dockerfile worker/Dockerfile
#
# Required secrets (set with `fly secrets set ...`):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   S3_BUCKET
#
# Optional secrets:
#   SLACK_WEBHOOK_URL  - if set, a failed scheduled run posts an alert here.

app = "gdspd-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "UTC"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[processes]
  app = "serve"
